<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Définition des formulaires Yurday</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <!--
    Page technique : elle déclare les champs du formulaire de contact pour que
    l'hébergeur (Netlify Forms) les détecte à la construction du site. Le
    formulaire React poste vers cette adresse ; aucun visiteur ne la voit.
  -->
  <form name="contact-yurday" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact-yurday" />
    <input name="bot-field" />
    <input type="text" name="nom" />
    <input type="tel" name="telephone" />
    <input type="email" name="email" />
    <input type="text" name="pourQui" />
    <input type="text" name="occasion" />
    <input type="text" name="budget" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
