<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Définition des formulaires Yurday</title>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <!--
    Page technique, jamais visitée par un humain.

    Netlify analyse les formulaires HTML au moment du déploiement, mais les pages
    produites par Next.js ne sont pas déposées sous forme de fichiers .html dans le
    dossier publié : sans cette copie statique, le formulaire ne serait pas détecté.
    C'est la méthode recommandée par Netlify pour les frameworks.

    Les noms des champs doivent rester identiques à ceux de
    src/components/home/ContactForm.tsx : ce sont les colonnes des réponses
    dans l'onglet « Forms » du tableau de bord.
  -->
  <form name="contact-yurday" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact-yurday" />
    <input type="text" name="bot-field" />
    <input type="text" name="nom" />
    <input type="tel" name="telephone" />
    <input type="email" name="email" />
    <input type="text" name="pourQui" />
    <input type="text" name="occasion" />
    <input type="text" name="budget" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
