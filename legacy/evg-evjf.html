<style>

  :root {
    --ink: #2B2119; --ink-soft: #6B5D4F; --paper: #FBF8F3; --paper-deep: #F2EBE1;
    --coral-1: #F2966B; --coral-2: #D9764B; --coral-3: #C2603D; --line: #E5D9C6;
    --sage: #4E8B72; --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  html[dir="rtl"] body { font-family: 'Cairo', 'Inter', sans-serif; }
  html[dir="rtl"] h1, html[dir="rtl"] h2, html[dir="rtl"] h3 { font-family: 'Cairo', 'Fraunces', serif; }
  html[dir="rtl"] .wa-float { right: auto; left: 26px; }
  @media (max-width: 640px) { html[dir="rtl"] .wa-float { left: 16px; } }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', -apple-system, sans-serif; font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  img { max-width: 100%; display: block; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; margin: 0; color: var(--ink); letter-spacing: -0.01em; }
  .container { max-width: 1120px; margin: 0 auto; padding: 0 28px; }
  .eyebrow { display: inline-block; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: var(--coral-3); margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 15px 30px; border-radius: 999px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 15px; cursor: pointer; border: none; transition: transform 0.2s ease, box-shadow 0.2s ease, background-position 0.4s ease; }
  .btn-primary { background-image: linear-gradient(100deg, var(--coral-1), var(--coral-3)); background-size: 160% auto; color: #fff; box-shadow: 0 10px 26px rgba(194, 96, 61, 0.32); }
  .btn-primary:hover { background-position: 100% 0; transform: translateY(-2px); box-shadow: 0 14px 30px rgba(194, 96, 61, 0.4); }
  .btn-ghost { background: transparent; border: 1.5px solid var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--coral-2); color: var(--coral-3); transform: translateY(-2px); }
  header { position: sticky; top: 0; z-index: 100; background: rgba(251, 248, 243, 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 28px; max-width: 1120px; margin: 0 auto; gap: 12px; }
  .nav-logo img { height: 34px; }
  @media (max-width: 480px) {
    .nav { padding: 12px 18px; }
    .nav .btn-primary { padding: 9px 14px; font-size: 12px; }
    .nav-logo img { height: 28px; }
  }
  .hero { position: relative; padding: 80px 28px 60px; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: -10%; background: radial-gradient(ellipse 700px 420px at 82% -8%, rgba(242,150,107,0.28), transparent 60%), radial-gradient(ellipse 600px 500px at 8% 105%, rgba(217,118,75,0.14), transparent 60%); animation: hero-drift 16s ease-in-out infinite; pointer-events: none; }
  @keyframes hero-drift { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-1.5%, 1.5%) scale(1.04); } }
  .hero-inner { max-width: 820px; margin: 0 auto; text-align: center; position: relative; }
  .hero h1 { font-size: clamp(34px, 5.4vw, 56px); line-height: 1.1; margin: 0 auto 22px; }
  .hero h1 em { font-style: italic; color: var(--coral-3); }
  .hero p.lede { font-size: 18px; color: var(--ink-soft); max-width: 540px; margin: 0 auto 32px; }
  .hero-ctas { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  section.contenu { padding: 64px 28px; }
  .bloc-histoire { max-width: 720px; margin: 0 auto; text-align: center; padding: 20px 0 0; }
  .bloc-histoire p { font-size: 17px; color: var(--ink-soft); line-height: 1.7; }
  .cta-final { background: linear-gradient(135deg, var(--coral-1), var(--coral-3)); border-radius: 28px; padding: 56px 40px; text-align: center; color: #fff; max-width: 900px; margin: 0 auto; }
  .cta-final h2 { color: #fff; font-size: 28px; margin-bottom: 14px; }
  .cta-final p { color: rgba(255,255,255,0.9); margin-bottom: 28px; font-size: 16px; }
  .cta-final .btn-primary { background-image: none; background: #fff; color: var(--coral-3); box-shadow: 0 10px 26px rgba(0,0,0,0.15); }
  .cta-final .btn-ghost { border-color: rgba(255,255,255,0.5); color: #fff; }
  .cta-final .btn-ghost:hover { border-color: #fff; color: #fff; }
  .autres-occasions { padding: 50px 28px 70px; text-align: center; }
  .autres-occasions h3 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-soft); margin-bottom: 18px; font-family: 'Inter', sans-serif; font-weight: 700; }
  .autres-occasions .liste { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .autres-occasions a { border: 1px solid var(--line); border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 600; color: var(--ink); background: #fff; }
  .autres-occasions a:hover { border-color: var(--coral-2); color: var(--coral-3); }
  footer { padding: 40px 28px; text-align: center; color: var(--ink-soft); font-size: 13px; border-top: 1px solid var(--line); background: var(--paper-deep); }
  footer img { height: 24px; margin-bottom: 10px; opacity: 0.85; }
  .footer-legal { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 12.5px; display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center; }
  .footer-legal a { text-decoration: underline; }
  .footer-legal a:hover { color: var(--coral-3); }
  @media (max-width: 640px) { footer { padding-bottom: 100px; } }
  .wa-float { position: fixed; bottom: 26px; right: 26px; z-index: 200; width: 66px; height: 66px; border-radius: 999px; background: #25D366; display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(37,211,102,0.4); transition: transform 0.2s ease; }
  .wa-float:hover { transform: scale(1.08); }
  @media (max-width: 640px) { .wa-float { width: 56px; height: 56px; bottom: 16px; right: 16px; } }
  .wa-float::before { content: ""; position: absolute; inset: 0; border-radius: 999px; background: #25D366; z-index: -1; animation: wa-pulse 2.4s ease-out infinite; }
  @keyframes wa-pulse { 0% { transform: scale(1); opacity: 0.55; } 100% { transform: scale(1.9); opacity: 0; } }

  /* ---------- Sélecteur de langue ---------- */
  .lang-switcher { position: relative; }
  .lang-current { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
  .lang-current .flag-icon, .lang-option .flag-icon { width: 18px; height: 12px; overflow: hidden; border-radius: 2px; display: inline-block; }
  .lang-current .flag-icon svg, .lang-option .flag-icon svg { width: 100%; height: 100%; display: block; }
  .lang-current .flag-icon:not(:has(svg)), .lang-option .flag-icon:not(:has(svg)) { display: flex; align-items: center; justify-content: center; overflow: visible; font-size: 13px; line-height: 1; box-shadow: none; }
  .lang-chevron { width: 8px; height: 8px; border-right: 1.5px solid var(--ink-soft); border-bottom: 1.5px solid var(--ink-soft); transform: rotate(45deg); margin-top: -3px; }
  .lang-menu { display: none; position: absolute; top: calc(100% + 6px); right: 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 30px rgba(43,33,25,0.12); list-style: none; margin: 0; padding: 6px; min-width: 170px; max-height: 320px; overflow-y: auto; z-index: 300; }
  html[dir="rtl"] .lang-menu { right: auto; left: 0; }
  .lang-switcher.open .lang-menu { display: block; }
  .lang-option { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13.5px; }
  .lang-option:hover, .lang-option.active { background: var(--paper-deep); }

</style>
